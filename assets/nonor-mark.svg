<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7 -7 114 125" width="114" height="125">
  <!-- NoNor mark — "C · continuous N", chosen by André 2026-09-10.
       Authored as STROKES, not traced: the render is raster with a baked ground and slight wobble, and a
       trace would inherit both. Geometry measured off the approved render (row-by-row run centres,
       normalised to a 100x111 ink box) so the vector matches what he picked rather than a redesign:
         stroke width  9.45  (87px of a 921px-wide mark)
         left stem + main diagonal are ONE stroke with a rounded apex — the rows prove it: at y=13..24
           they read as a SINGLE merged run and only separate at y=27.8. Drawing them as two strokes left
           a gap the original does not have.
         stem x=4.7 (y 106 up to 18), apex, then the diagonal down to (55.5,74) ending mid-air in a cap
          2nd diagonal (24.2,57) -> bottom, same slope, then a U-turn into
         right stem    x=71.4, up to y=30, where it becomes the leaf
       One colour, one stroke weight, no gradient — so it recolours by changing `stroke`. -->
  <g fill="none" stroke="currentColor" stroke-width="9.45" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 4.7 106 L 4.7 18 Q 4.7 11 11.2 15.4 L 55.5 74"/>
    <path d="M 26 57.5 L 53.7 99 Q 62.6 110.5 71.4 99 L 71.4 30"/>
    <path d="M 71.4 30 C 71.4 12.5 83.5 1.5 100 1.5 C 100 19 88 30 71.4 30 Z"/>
  </g>
</svg>
